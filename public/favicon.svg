<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="soleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Speed Dash lines behind shoe -->
  <path d="M70 210 L150 210" stroke="#10b981" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
  <path d="M45 256 L125 256" stroke="#10b981" stroke-width="16" stroke-linecap="round" opacity="0.8"/>
  <path d="M80 302 L145 302" stroke="#10b981" stroke-width="14" stroke-linecap="round" opacity="0.6"/>

  <!-- Athletic Performance Running Sneaker Silhouette -->
  <g filter="url(#glow)">
    <!-- Main Shoe Upper Body -->
    <path d="M 160 270 
             C 170 215, 220 170, 290 160
             C 325 155, 360 175, 375 205
             C 385 225, 410 260, 445 285
             C 460 296, 465 310, 458 325
             C 450 338, 430 342, 395 342
             L 165 342
             C 150 342, 142 332, 145 318
             C 148 300, 155 282, 160 270 Z" 
          fill="url(#accentGrad)"/>

    <!-- Dynamic Speed Cut / Accent Overlay -->
    <path d="M 230 205
             C 270 190, 315 205, 345 235
             C 365 255, 395 280, 440 295
             L 420 325
             C 380 315, 350 285, 325 265
             C 300 245, 265 235, 230 245 Z" 
          fill="#ffffff" opacity="0.25"/>

    <!-- Sneaker Collar / Ankle Opening -->
    <path d="M 255 178
             C 275 168, 305 172, 320 190
             C 328 200, 322 212, 308 215
             C 285 220, 260 205, 255 178 Z"
          fill="#0f172a"/>

    <!-- Cushioning Midsole / Running Sole -->
    <path d="M 135 342
             C 135 330, 145 324, 160 324
             L 435 324
             C 455 324, 468 335, 472 350
             C 475 365, 460 380, 435 382
             C 385 386, 335 372, 275 375
             C 220 378, 175 384, 142 376
             C 133 374, 130 365, 132 355 Z"
          fill="url(#soleGrad)"/>

    <!-- Sole Grip Segments (Performance Pods) -->
    <path d="M 160 370 Q 185 365 210 370" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <path d="M 235 370 Q 265 364 295 370" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <path d="M 320 370 Q 355 365 390 370" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Sparkle / Star of Excellence -->
  <path d="M 405 135 Q 405 160 425 160 Q 405 160 405 185 Q 405 160 385 160 Q 405 160 405 135 Z" fill="#34d399"/>
</svg>